name: PDF Entscheidungshilfe aktualisieren

on:
  push:
    paths:
      - '.github/workflows/pdf-decision-helper.yml'
      - '.github/scripts/apply_pdf_decision_helper.py'
      - '.github/scripts/update_environment_energy_block.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Entscheidungshilfe und Safari-Druck fixen
        run: python3 .github/scripts/apply_pdf_decision_helper.py

      - name: Umweltenergie-Block aktualisieren
        run: python3 .github/scripts/update_environment_energy_block.py

      - name: Änderung speichern
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Keine Änderung nötig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Emphasize environmental energy in heat pump explanation"
          git push

# trigger environment energy update 2026-09-05
