name: One-shot Safari print pagination fix

on:
  push:
    paths:
      - '.github/workflows/print-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append Safari print override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="safariTwoPagePrintFix">'
          if marker in s:
              raise SystemExit(0)
          css = '''
<style id="safariTwoPagePrintFix">
@media print {
  @page { size: A4; margin: 8mm; }

  #calculatorPrintSummary {
    width: 190mm !important;
    max-width: 190mm !important;
    margin: 0 auto !important;
    font-size: 8.4pt !important;
    line-height: 1.24 !important;
  }

  .print-page {
    display: block !important;
    width: 190mm !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    position: static !important;
    overflow: visible !important;
    break-inside: auto !important;
    page-break-inside: auto !important;
  }

  #printFundingPage {
    break-before: auto !important;
    page-break-before: auto !important;
    break-after: page !important;
    page-break-after: always !important;
  }

  #printHeatingPage {
    break-before: auto !important;
    page-break-before: auto !important;
    break-after: auto !important;
    page-break-after: auto !important;
  }

  #printFundingPage .print-title { font-size: 21pt !important; margin: 1.5mm 0 .8mm !important; }
  #printFundingPage .print-subtitle { font-size: 9pt !important; margin: 0 0 3mm !important; }
  #printFundingPage .print-section-title { font-size: 14pt !important; margin: 0 0 2mm !important; padding-bottom: 1.4mm !important; }
  #printFundingPage .print-intro { margin: 0 0 2.5mm !important; }
  #printFundingPage .print-block-title { font-size: 9pt !important; margin: 0 0 1.2mm !important; }
  #printFundingPage .print-primary-grid { gap: 1.6mm !important; margin-bottom: 2.5mm !important; }
  #printFundingPage .print-primary-item { padding: 2.6mm 3mm !important; }
  #printFundingPage .print-primary-item .print-value { font-size: 15pt !important; margin-top: .8mm !important; }
  #printFundingPage .print-facts-grid { gap: 1.5mm !important; margin-bottom: 2.5mm !important; }
  #printFundingPage .print-fact { padding: 2mm 2.4mm !important; min-height: 11.5mm !important; }
  #printFundingPage .print-finance-compare { margin: 0 0 2mm !important; }
  #printFundingPage .print-finance-heading { padding: 1.8mm 2.5mm !important; font-size: 8pt !important; }
  #printFundingPage .print-finance-cell { padding: 1.3mm 2.2mm !important; }
  #printFundingPage .print-finance-cell.term { font-size: 8.6pt !important; }
  #printFundingPage .print-finance-rate { font-size: 12pt !important; }
  #printFundingPage .print-finance-note { padding: 1.5mm 2.5mm !important; font-size: 7.4pt !important; }
  #printFundingPage .print-bonuses,
  #printFundingPage .print-requirements { padding: 1.8mm 2.5mm !important; margin: 0 0 1.5mm !important; }
  #printFundingPage .print-bonuses h3,
  #printFundingPage .print-requirements h3 { font-size: 8.7pt !important; margin: 0 0 .8mm !important; }
  #printFundingPage .print-bonuses li,
  #printFundingPage .print-requirements li { margin: 0 0 .4mm !important; }

  .print-disclaimer {
    position: static !important;
    left: auto !important;
    right: auto !important;
    bottom: auto !important;
    margin-top: 1.5mm !important;
    padding: 2mm 2.5mm !important;
    font-size: 7.4pt !important;
  }

  #printHeatingPage .print-disclaimer { margin-top: 0 !important; }
}
</style>
'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit print fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Safari blank page in calculator PDF'
          git push
