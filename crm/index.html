<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GALVANY CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#071a2c;--navy2:#0d2944;--green:#5ba646;--red:#e34b4b;--bg:#f4f7f8;--card:#fff;--ink:#142334;--muted:#6c7885;--line:#dfe7ea;--shadow:0 14px 36px rgba(7,26,44,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:24px max(20px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px}
    header h1{font-size:26px;margin:0} header p{margin:4px 0 0;color:#c9d6df;font-size:14px}.wrap{max-width:1280px;margin:26px auto;padding:0 20px}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}.filter{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;font-weight:650}.date-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date-filter{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:12px;font-weight:700}.date-filter input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;min-width:118px}.date-filter input:focus{outline:none}.clear-filter{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-weight:700;cursor:pointer}.clear-filter:hover{color:var(--ink);border-color:#bccbd1}.badge{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 180px)}.crm{width:100%;border-collapse:collapse;min-width:1400px}.crm th,.crm td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}.crm th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fbfcfd;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}.crm th:first-child,.crm td:first-child{text-align:left;min-width:220px}.crm th:nth-child(2),.crm td:nth-child(2){text-align:left;min-width:220px}.crm th:last-child,.crm td:last-child{text-align:left;min-width:260px}.crm tr.row-vertrag td{background:rgba(91,166,70,.17)}.crm tr.row-verloren td{background:rgba(227,75,75,.15)}.crm tr.row-storno td{background:rgba(227,75,75,.22)}.name{font-weight:750}.contact{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--muted)}.contact a{text-decoration:none;color:inherit}.address a{color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}.address a:hover{text-decoration:underline}.address-empty{color:var(--muted);font-size:12px}
    .dot{position:relative;width:38px;height:38px;border:0;background:transparent;cursor:pointer;padding:0;vertical-align:middle;filter:drop-shadow(0 2px 2px rgba(7,26,44,.18))}.dot::before{content:"";position:absolute;left:7px;top:7px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#f8f8f8 0 10%,#c9c9c9 22%,#747474 45%,#e6e6e6 61%,#888 75%,#d7d7d7 100%);box-shadow:inset 0 0 0 1px #777,0 1px 2px rgba(0,0,0,.22)}.dot::after{content:"";position:absolute;left:16px;width:6px;height:22px;border-radius:4px;background:linear-gradient(90deg,#666,#f4f4f4 35%,#999 70%,#555);box-shadow:0 1px 2px rgba(0,0,0,.35);transform-origin:50% 50%;transition:top .14s ease,transform .14s ease,background .14s ease}.dot.green::after{top:-1px;transform:rotate(0deg);background:linear-gradient(90deg,#28751d,#78c765 38%,#4a9b39 70%,#205f18)}.dot.red::after{top:17px;transform:rotate(0deg);background:linear-gradient(90deg,#a82d2d,#f06b6b 38%,#d94747 70%,#8d2222)}.dot:active{transform:scale(.94)}
    .offer-meta{margin-top:4px;font-size:10px;line-height:1.35;color:var(--muted);white-space:nowrap}.offer-meta strong{font-weight:700;color:var(--ink)}
    .dot-slot{height:32px;overflow:hidden}
    .crm td.dot-td{vertical-align:top}
    .due{font-size:11px;margin-top:5px;color:var(--muted)}.due.overdue{color:var(--red);font-weight:700}.status{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;font-weight:650}.status.vertrag{color:#377b28;border-color:#a9d59d;background:#eff9ec}.status.verloren{color:#a23939;border-color:#efb0b0;background:#fff0f0}.status.storno{color:#8f2d2d;border-color:#e59a9a;background:#ffe8e8}.offer-price{width:145px;min-height:58px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.9);color:var(--ink);font:inherit;font-size:13px;line-height:1.35}.offer-price:focus{outline:2px solid rgba(91,166,70,.25);border-color:var(--green)}.offer-price.saving{opacity:.65}.discount{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.9);color:var(--ink);font:inherit;font-size:13px}.discount:focus{outline:2px solid rgba(91,166,70,.25);border-color:var(--green)}.discount.saving{opacity:.65}.note{width:100%;min-width:240px;min-height:58px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.9);color:var(--ink);font:inherit;font-size:13px;line-height:1.35}.note:focus{outline:2px solid rgba(91,166,70,.25);border-color:var(--green)}.note.saving{opacity:.65}.empty{padding:42px;text-align:center;color:var(--muted)}
    .login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}.login h2{margin-top:0}.login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px}.login button,.logout{margin-top:12px;padding:11px 15px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.logout{margin:0;background:rgba(255,255,255,.15)}.hidden{display:none!important}.msg{font-size:13px;color:var(--muted);margin-top:10px}.undo-toast{position:fixed;left:50%;bottom:24px;z-index:10;transform:translate(-50%,12px);display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:10px;background:rgba(7,26,44,.94);color:#fff;box-shadow:0 8px 24px rgba(7,26,44,.22);font-size:13px;opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility .18s}.undo-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}.undo-toast button{border:0;background:transparent;color:#fff;padding:0;font:inherit;font-weight:750;text-decoration:underline;cursor:pointer}
    @media(max-width:700px){header{padding:18px 16px}.wrap{padding:0 12px;margin-top:16px}.toolbar>*{width:100%}.date-filters{width:100%}.date-filter{flex:1;min-width:145px}.clear-filter{width:auto}.tablewrap{border-radius:14px}.crm th,.crm td{padding:12px 10px}.crm tr.row-vertrag td{background:rgba(91,166,70,.12)}.crm tr.row-verloren td{background:rgba(227,75,75,.10)}.dot{width:42px;height:42px}.dot::before{left:8px;top:8px;width:26px;height:26px}.dot::after{left:18px;height:24px}.dot.green::after{top:-1px}.dot.red::after{top:19px}.offer-meta{font-size:9px}.note{min-width:220px}}
  </style>
</head>
<body>
  <header><div><h1>GALVANY CRM</h1><p>Leads · Termine · Angebote · Nachfassen</p></div><button id="logoutBtn" class="logout hidden">Abmelden</button></header>
  <main>
    <section id="loginView" class="login"><h2>Anmelden</h2><p>Dein privates GALVANY-Vertriebsboard.</p><input id="email" type="email" autocomplete="email" placeholder="E-Mail-Adresse"><button id="loginBtn">Login-Link senden</button><div id="loginMsg" class="msg"></div></section>
    <section id="appView" class="wrap hidden"><div class="toolbar"><input id="search" class="search" placeholder="Kunde suchen …"><select id="statusFilter" class="filter"><option value="alle">Alle Status</option><option value="vertrag">Vertrag</option><option value="verloren">Verloren</option><option value="storno">Storno</option><option value="offen">Offen</option></select><div class="date-filters" aria-label="Angebotszeitraum"><label class="date-filter">Monat <input id="offerMonth" type="month" aria-label="Angebotsmonat"></label><label class="date-filter">Von <input id="offerFrom" type="date" aria-label="Angebote von"></label><label class="date-filter">Bis <input id="offerTo" type="date" aria-label="Angebote bis"></label><button id="clearOfferDates" class="clear-filter" type="button">Zeitraum löschen</button></div><div id="count" class="badge">0 Kunden</div></div><div class="tablewrap"><table class="crm"><thead><tr><th>Kunde</th><th>Adresse</th><th>Herkunft</th><th>Termin</th><th>Wahrgenommen</th><th>Angebot</th><th>Nachfassen</th><th>Status</th><th>Angebotspreis</th><th>Rabatt</th><th>Notiz</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">Keine Kunden gefunden.</div></div></section>
  </main>
  <div id="undoToast" class="undo-toast" role="status" aria-live="polite"><span>Status geändert ·</span><button id="undoBtn" type="button">Rückgängig</button></div>
<script>
const SUPABASE_URL='https://lcyfhlknzmgjmffhvlvx.supabase.co';
const SUPABASE_KEY='sb_publishable_bxgh_jkrvrTFETuOscflNg_mn4V09qK';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const STATUS_FIELDS=new Set(['lead_done','appointment_done','meeting_completed','offer_done','follow_up_done']);let leads=[];let undoAction=null;let undoTimer=null;const pendingStatusUpdates=new Set();const noteTimers=new Map();
function fmtDate(d){if(!d)return '';return new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))}function fmtAppointment(ts){if(!ts)return '';const d=new Date(ts);if(Number.isNaN(d.getTime()))return '';const datePart=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',day:'2-digit',month:'2-digit',year:'numeric'}).format(d);const timePart=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);return `${datePart} · ${timePart}`}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function dot(row,field,extra=''){const val=!!row[field];return `<button class="dot ${val?'green':'red'}" aria-label="${field}" aria-pressed="${val}" onclick="toggle('${row.id}','${field}')"></button>${extra}`}
function sortGroup(r){if(r.status==='vertrag')return 0;if(r.status==='verloren')return 1;if(r.status==='storno')return 2;return 3}function sortTime(r){const d=r.lead_received_at||r.created_at||'';const t=Date.parse(d);return Number.isFinite(t)?t:0}
function dateKey(value){if(!value)return '';const match=String(value).match(/^(\d{4}-\d{2}-\d{2})/);return match?match[1]:''}function offerDates(row){const sent=[dateKey(row.panasonic_offer_sent_at),dateKey(row.vaillant_offer_sent_at)].filter(Boolean);return sent.length?sent:[dateKey(row.offer_date)].filter(Boolean)}function matchesOfferPeriod(row){const month=$('offerMonth').value;const from=$('offerFrom').value;const to=$('offerTo').value;if(!month&&!from&&!to)return true;return offerDates(row).some(date=>(!month||date.startsWith(month))&&(!from||date>=from)&&(!to||date<=to))}
function render(){const q=$('search').value.trim().toLowerCase();const sf=$('statusFilter').value;const data=leads.filter(r=>(sf==='alle'||r.status===sf)&&matchesOfferPeriod(r)&&`${r.first_name||''} ${r.last_name||''} ${r.street||''} ${r.postal_code||''} ${r.city||''} ${r.notes||''}`.toLowerCase().includes(q)).sort((a,b)=>sortGroup(a)-sortGroup(b)||sortTime(b)-sortTime(a)||String(a.last_name||'').localeCompare(String(b.last_name||''),'de'));$('count').textContent=`${data.length} Kunde${data.length===1?'':'n'}`;$('rows').innerHTML=data.map(r=>{const overdue=r.follow_up_due_date&&!r.follow_up_done&&new Date(r.follow_up_due_date+'T23:59:59')<new Date();const due=r.follow_up_due_date?`<div class="due ${overdue?'overdue':''}">${overdue?'fällig: ':'ab: '}${fmtDate(r.follow_up_due_date)}</div>`:'';const phone=r.phone?`<a href="tel:${esc(r.phone)}">☎ ${esc(r.phone)}</a>`:'';const mail=r.email?`<a href="mailto:${esc(r.email)}">✉ Mail</a>`:'';const addressText=[r.street,[r.postal_code,r.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');const address=addressText?`<div class="address"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addressText)}" target="_blank" rel="noopener noreferrer" title="In Google Maps öffnen">📍 ${esc(addressText)}</a></div>`:`<span class="address-empty">–</span>`;const apptTime=r.appointment_at?`<div class="due">${fmtAppointment(r.appointment_at)}</div>`:'';const offerLines=[];if(r.panasonic_offer_sent_at)offerLines.push(`<div><strong>Panasonic</strong> · ${fmtDate(r.panasonic_offer_sent_at)}</div>`);if(r.vaillant_offer_sent_at)offerLines.push(`<div><strong>Vaillant</strong> · ${fmtDate(r.vaillant_offer_sent_at)}</div>`);const offerMeta=offerLines.length?`<div class="offer-meta">${offerLines.join('')}</div>`:'';const rowClass=r.status==='vertrag'?'row-vertrag':r.status==='verloren'?'row-verloren':r.status==='storno'?'row-storno':'';return `<tr class="${rowClass}"><td><div class="name">${esc(r.first_name)} ${esc(r.last_name)}</div><div class="contact">${phone}${mail}</div></td><td>${address}</td><td><select class="status" aria-label="Lead-Herkunft" onchange="setLeadSource('${r.id}',this.value)"><option value="" ${!r.lead_source?'selected':''}>–</option><option value="firmenlead" ${r.lead_source==='firmenlead'?'selected':''}>Firmenlead</option><option value="eigenlead" ${r.lead_source==='eigenlead'?'selected':''}>Eigenlead</option></select></td><td class="dot-td">${dot(r,'appointment_done','<div class="dot-slot">'+apptTime+'</div>')}</td><td class="dot-td">${dot(r,'meeting_completed','<div class="dot-slot"></div>')}</td><td class="dot-td">${dot(r,'offer_done','<div class="dot-slot">'+offerMeta+'</div>')}</td><td class="dot-td">${dot(r,'follow_up_done','<div class="dot-slot">'+due+'</div>')}</td><td><select class="status ${r.status}" onchange="setStatus('${r.id}',this.value)"><option value="offen" ${r.status==='offen'?'selected':''}>Offen</option><option value="vertrag" ${r.status==='vertrag'?'selected':''}>Vertrag</option><option value="verloren" ${r.status==='verloren'?'selected':''}>Verloren</option><option value="storno" ${r.status==='storno'?'selected':''}>Storno</option></select></td><td><textarea class="offer-price" placeholder="P 38.651,20 €&#10;V 35.940,00 €" oninput="offerPriceChanged('${r.id}',this)">${esc(r.offer_price||'')}</textarea></td><td><input class="discount" type="text" inputmode="decimal" placeholder="" value="${esc(r.discount||'')}" oninput="discountChanged('${r.id}',this)"></td><td><textarea class="note" placeholder="z. B. verschoben, Dezember, Krankheitsfall …" oninput="noteChanged('${r.id}',this)">${esc(r.notes||'')}</textarea></td></tr>`}).join('');$('empty').classList.toggle('hidden',data.length!==0)}
async function load(){const {data,error}=await sb.from('galvany_leads').select('*').order('lead_received_at',{ascending:false});if(error){alert('CRM konnte nicht geladen werden: '+error.message);return false}leads=data||[];render();return true}
function hideUndo(){clearTimeout(undoTimer);$('undoToast').classList.remove('show')}
function showUndo(action){undoAction=action;clearTimeout(undoTimer);$('undoToast').classList.add('show');undoTimer=setTimeout(()=>{undoAction=null;hideUndo()},6000)}
async function saveStatus(id,field,value,followUpCompletedAt){const patch={[field]:value};if(field==='follow_up_done')patch.follow_up_completed_at=followUpCompletedAt;return sb.from('galvany_leads').update(patch).eq('id',id)}
window.toggle=async(id,field)=>{if(!STATUS_FIELDS.has(field))return;const key=`${id}:${field}`;if(pendingStatusUpdates.has(key))return;const row=leads.find(item=>String(item.id)===String(id));if(!row)return;const previousValue=!!row[field];const previousFollowUpCompletedAt=row.follow_up_completed_at??null;const nextValue=!previousValue;const nextFollowUpCompletedAt=field==='follow_up_done'?(nextValue?new Date().toISOString():null):undefined;pendingStatusUpdates.add(key);const {error}=await saveStatus(id,field,nextValue,nextFollowUpCompletedAt);if(error){await load();alert(error.message);pendingStatusUpdates.delete(key);return}await load();pendingStatusUpdates.delete(key);showUndo({id,field,previousValue,previousFollowUpCompletedAt})};
$('undoBtn').onclick=async()=>{const action=undoAction;if(!action)return;const key=`${action.id}:${action.field}`;if(pendingStatusUpdates.has(key))return;undoAction=null;hideUndo();pendingStatusUpdates.add(key);const followUpCompletedAt=action.field==='follow_up_done'?action.previousFollowUpCompletedAt:undefined;const {error}=await saveStatus(action.id,action.field,action.previousValue,followUpCompletedAt);await load();pendingStatusUpdates.delete(key);if(error)alert(error.message)};
window.setStatus=async(id,status)=>{const {error}=await sb.from('galvany_leads').update({status}).eq('id',id);if(error){alert(error.message);return}await load()};window.setLeadSource=async(id,lead_source)=>{const value=lead_source||null;const {error}=await sb.from('galvany_leads').update({lead_source:value}).eq('id',id);if(error){alert(error.message);await load();return}await load()};
window.offerPriceChanged=(id,el)=>{const row=leads.find(item=>String(item.id)===String(id));if(row)row.offer_price=el.value;clearTimeout(noteTimers.get('offer_price:'+id));noteTimers.set('offer_price:'+id,setTimeout(async()=>{el.classList.add('saving');const value=el.value;const {error}=await sb.from('galvany_leads').update({offer_price:value}).eq('id',id);el.classList.remove('saving');if(error){alert('Angebotspreis konnte nicht gespeichert werden: '+error.message);await load()}noteTimers.delete('offer_price:'+id)},700))};
window.discountChanged=(id,el)=>{const row=leads.find(item=>String(item.id)===String(id));if(row)row.discount=el.value;clearTimeout(noteTimers.get('discount:'+id));noteTimers.set('discount:'+id,setTimeout(async()=>{el.classList.add('saving');const value=el.value;const {error}=await sb.from('galvany_leads').update({discount:value}).eq('id',id);el.classList.remove('saving');if(error){alert('Rabatt konnte nicht gespeichert werden: '+error.message);await load()}noteTimers.delete('discount:'+id)},700))};
window.noteChanged=(id,el)=>{const row=leads.find(item=>String(item.id)===String(id));if(row)row.notes=el.value;clearTimeout(noteTimers.get(id));noteTimers.set(id,setTimeout(async()=>{el.classList.add('saving');const value=el.value;const {error}=await sb.from('galvany_leads').update({notes:value}).eq('id',id);el.classList.remove('saving');if(error){alert('Notiz konnte nicht gespeichert werden: '+error.message);await load()}noteTimers.delete(id)},700))};
$('search').addEventListener('input',render);$('statusFilter').addEventListener('change',render);$('offerMonth').addEventListener('change',()=>{if($('offerMonth').value){$('offerFrom').value='';$('offerTo').value=''}render()});$('offerFrom').addEventListener('change',()=>{if($('offerFrom').value)$('offerMonth').value='';render()});$('offerTo').addEventListener('change',()=>{if($('offerTo').value)$('offerMonth').value='';render()});$('clearOfferDates').onclick=()=>{$('offerMonth').value='';$('offerFrom').value='';$('offerTo').value='';render()};
$('loginBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return;$('loginMsg').textContent='Sende Login-Link …';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('loginMsg').textContent=error?error.message:'Login-Link wurde per E-Mail gesendet.'};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}sb.auth.onAuthStateChange(async(_,s)=>{if(s){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}})}boot();
</script></body></html>
