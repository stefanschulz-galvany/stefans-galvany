<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GALVANY CRM</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#071a2c;--navy2:#0d2944;--green:#5ba646;--red:#e34b4b;--bg:#f4f7f8;--card:#fff;--ink:#142334;--muted:#6c7885;--line:#dfe7ea;--shadow:0 14px 36px rgba(7,26,44,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:24px max(20px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px}
    header h1{font-size:26px;margin:0} header p{margin:4px 0 0;color:#c9d6df;font-size:14px}.wrap{max-width:1280px;margin:26px auto;padding:0 20px}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}.badge{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}
    .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:auto}.crm{width:100%;border-collapse:collapse;min-width:980px}.crm th,.crm td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}.crm th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:#fbfcfd;position:sticky;top:0;z-index:2}.crm th:first-child,.crm td:first-child{text-align:left;min-width:220px}.name{font-weight:750}.contact{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--muted)}.contact a{text-decoration:none;color:inherit}.dot{width:28px;height:28px;border:0;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 1px 4px rgba(0,0,0,.18)}.dot.red{background:var(--red)}.dot.green{background:var(--green)}.dot:active{transform:scale(.92)}
    .due{font-size:11px;margin-top:5px;color:var(--muted)}.due.overdue{color:var(--red);font-weight:700}.status{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;font-weight:650}.status.vertrag{color:#377b28;border-color:#a9d59d;background:#eff9ec}.status.verloren{color:#a23939;border-color:#efb0b0;background:#fff0f0}.empty{padding:42px;text-align:center;color:var(--muted)}
    .login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}.login h2{margin-top:0}.login input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px}.login button,.logout{margin-top:12px;padding:11px 15px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}.logout{margin:0;background:rgba(255,255,255,.15)}.hidden{display:none!important}.msg{font-size:13px;color:var(--muted);margin-top:10px}
    @media(max-width:700px){header{padding:18px 16px}.wrap{padding:0 12px;margin-top:16px}.tablewrap{border-radius:14px}.crm th,.crm td{padding:12px 10px}.dot{width:32px;height:32px}}
  </style>
</head>
<body>
  <header><div><h1>GALVANY CRM</h1><p>Leads · Termine · Angebote · Nachfassen</p></div><button id="logoutBtn" class="logout hidden">Abmelden</button></header>
  <main>
    <section id="loginView" class="login"><h2>Anmelden</h2><p>Dein privates GALVANY-Vertriebsboard.</p><input id="email" type="email" autocomplete="email" placeholder="E-Mail-Adresse"><button id="loginBtn">Login-Link senden</button><div id="loginMsg" class="msg"></div></section>
    <section id="appView" class="wrap hidden"><div class="toolbar"><input id="search" class="search" placeholder="Kunde suchen …"><div id="count" class="badge">0 Kunden</div></div><div class="tablewrap"><table class="crm"><thead><tr><th>Kunde</th><th>Lead</th><th>Termin</th><th>Wahrgenommen</th><th>Angebot</th><th>Nachfassen</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">Keine Kunden gefunden.</div></div></section>
  </main>
<script>
const SUPABASE_URL='https://lcyfhlknzmgjmffhvlvx.supabase.co';
const SUPABASE_KEY='sb_publishable_bxgh_jkrvrTFETuOscflNg_mn4V09qK';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let leads=[];
function fmtDate(d){if(!d)return '';return new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function dot(row,field,extra=''){const val=!!row[field];return `<button class="dot ${val?'green':'red'}" aria-label="${field}" onclick="toggle('${row.id}','${field}',${val})"></button>${extra}`}
function render(){const q=$('search').value.trim().toLowerCase();const data=leads.filter(r=>`${r.first_name||''} ${r.last_name||''} ${r.city||''}`.toLowerCase().includes(q));$('count').textContent=`${data.length} Kunde${data.length===1?'':'n'}`;$('rows').innerHTML=data.map(r=>{const overdue=r.follow_up_due_date&&!r.follow_up_done&&new Date(r.follow_up_due_date+'T23:59:59')<new Date();const due=r.follow_up_due_date?`<div class="due ${overdue?'overdue':''}">${overdue?'fällig: ':'ab: '}${fmtDate(r.follow_up_due_date)}</div>`:'';const phone=r.phone?`<a href="tel:${esc(r.phone)}">☎ ${esc(r.phone)}</a>`:'';const mail=r.email?`<a href="mailto:${esc(r.email)}">✉ Mail</a>`:'';return `<tr><td><div class="name">${esc(r.first_name)} ${esc(r.last_name)}</div><div class="contact">${phone}${mail}</div></td><td>${dot(r,'lead_done')}</td><td>${dot(r,'appointment_done')}</td><td>${dot(r,'meeting_completed')}</td><td>${dot(r,'offer_done')}</td><td>${dot(r,'follow_up_done',due)}</td><td><select class="status ${r.status}" onchange="setStatus('${r.id}',this.value)"><option value="offen" ${r.status==='offen'?'selected':''}>Offen</option><option value="vertrag" ${r.status==='vertrag'?'selected':''}>Vertrag</option><option value="verloren" ${r.status==='verloren'?'selected':''}>Verloren</option></select></td></tr>`}).join('');$('empty').classList.toggle('hidden',data.length!==0)}
async function load(){const {data,error}=await sb.from('galvany_leads').select('*').order('lead_received_at',{ascending:false});if(error){alert('CRM konnte nicht geladen werden: '+error.message);return}leads=data||[];render()}window.toggle=async(id,field,current)=>{const patch={[field]:!current};if(field==='follow_up_done'&&!current)patch.follow_up_completed_at=new Date().toISOString();const {error}=await sb.from('galvany_leads').update(patch).eq('id',id);if(error){alert(error.message);return}await load()} ;window.setStatus=async(id,status)=>{const {error}=await sb.from('galvany_leads').update({status}).eq('id',id);if(error){alert(error.message);return}await load()};$('search').addEventListener('input',render);
$('loginBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return;$('loginMsg').textContent='Sende Login-Link …';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$('loginMsg').textContent=error?error.message:'Login-Link wurde per E-Mail gesendet.'};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}sb.auth.onAuthStateChange(async(_,s)=>{if(s){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await load()}})}boot();
</script></body></html>
